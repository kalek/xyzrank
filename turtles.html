        /* CSS Section */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #1e1e1e;
            padding: 1rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            width: 90%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #333;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .image-container {
            width: 100%;
            height: 400px;
            background-color: #000;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            overflow: hidden;
            border: 2px solid #333;
        }

        #card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .rating-display {
            height: 60px;
            margin-bottom: 1rem;
        }

        #rating-box {
            font-size: 2.5rem;
            font-weight: 900;
            color: #2ecc71;
            /* Usunięcie transition zapobiega powolnemu znikaniu przy zmianie karty */
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .hidden {
            opacity: 0;
            transform: scale(0.5);
        }

        .btn-reveal {
            background: #2ecc71;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 1.5rem;
        }

        .btn-reveal:hover {
            background: #27ae60;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: #3d3d3d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: #555;
        }

        #counter {
            font-family: monospace;
            color: #888;
            min-width: 60px;
        }
    </style>

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // Wywołujemy mieszanie na samym starcie
    shuffleArray(cards);

        let currentIndex = 0;

        const ratingValueEl = document.getElementById('rating-value');
        const counterEl = document.getElementById('counter');
        const revealBtn = document.getElementById('reveal-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

// --- LOGIKA SWIPE ---
    let touchStartX = 0;
    let touchEndX = 0;
    const minSwipeDistance = 50; // Minimalna odległość w pikselach, by uznać to za swipe

    const handleGesture = () => {
        const swipeDistance = touchEndX - touchStartX;
        
        if (swipeDistance > minSwipeDistance) {
            // Swipe w prawo -> Poprzednia
            prevBtn.click();
        } else if (swipeDistance < -minSwipeDistance) {
            // Swipe w lewo -> Następna
            nextBtn.click();
        }
    };

    // Nasłuchiwanie dotyku na całym kontenerze obrazka lub body
    document.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleGesture();
    }, false);
    // ---------------------

        function updateDisplay() {
            const card = cards[currentIndex];
            
            // 1. Najpierw ukrywamy box i czyścimy tekst oceny
            ratingBox.classList.add('hidden');
            ratingValueEl.innerText = ""; 

            // 2. Zmieniamy obrazek
            cardImgEl.src = `card_images/${card.name}.jpg`;
            cardImgEl.alt = card.name;
            
            // 3. Dopiero teraz przypisujemy nową wartość do ukrytego elementu
            ratingValueEl.innerText = card.tier;
            
            // 4. Aktualizacja licznika
            counterEl.innerText = `${currentIndex + 1} / ${cards.length}`;
        }

        // Event Listeners
        revealBtn.addEventListener('click', () => {
            ratingBox.classList.remove('hidden');
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % cards.length;
            updateDisplay();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateDisplay();
        });

        // Obsługa klawiatury (strzałki i spacja)
        document.addEventListener('keydown', (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                ratingBox.classList.remove('hidden');
            } else if (e.code === "ArrowRight") {
                nextBtn.click();
            } else if (e.code === "ArrowLeft") {
                prevBtn.click();
            }
        });

        // Start aplikacji
        updateDisplay();
